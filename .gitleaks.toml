# Secret scanning (R1-47, F-09): gitleaks with its default rules, run by .github/workflows/security.yml on every push and
# pull request (the commits in the change) and weekly (the whole history and tree).
#
# Exceptions are listed here with a reason and stay as narrow as possible. No directory and no line pattern is exempt:
# every exception names its rule, its file and the exact value (condition AND), so a real credential anywhere — in a
# test, in a vendored bundle, on a line next to an excepted value — or the same value in another file still fails the job. Never add a broad pattern to make a real
# finding pass. Rotate a leaked secret first, then remove it from history.

[extend]
useDefault = true

# Vendored third-party bundles (minified JavaScript, not maintained here): no directory is exempt, only the two
# identifiers the generic rule mistakes for keys, each in its own bundle (the Whiskers path and the pre-rename ServerWatch
# path of the history).
[[allowlists]]
description = "xterm.js identifier, not a key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/(Whiskers|ServerWatch)/wwwroot/js/vendor/xterm\.min\.js$''']
regexes = ['''^t\.TwoKeyMap=void$''']

[[allowlists]]
description = "vis-network method name, not a key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/(Whiskers|ServerWatch)/wwwroot/js/vendor/vis-network\.min\.js$''']
regexes = ['''^_getDistanceToBezierEdge2$''']

# Test fixtures: each a deliberately fake value that exercises redaction or secret handling, allowed only in its file.
# Each names its rule (targetRules): gitleaks 8.30 skips a whole file that matches the path of a global allowlist and
# ignores condition = "AND" there; a rule-scoped allowlist is checked per finding, so path AND value must both match.
[[allowlists]]
description = "Fake basic-auth user in a curl command (audit fail-closed test)"
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/AuditFailClosedTests\.cs$''']
regexes = ['''^deploy:hunter6$''']

[[allowlists]]
description = "Fake basic-auth canary in a curl command (sink redaction test)"
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/SinkRedactionTests\.cs$''']
regexes = ['''^deploy:\{Canary\}\{new$''']

[[allowlists]]
description = "Fake basic-auth probe in a curl command (audit path matrix test: the event keeps none of it)"
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/AuditPathMatrixTests\.cs$''']
regexes = ['''^admin:\{Probe\}$''']

[[allowlists]]
description = "Fake API key (automation mutation runner test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/AutomationMutationRunnerTests\.cs$''']
regexes = ['''^Violet47Lantern$''']

[[allowlists]]
description = "SHA-256 of the committed PostgreSQL (PGDG) public key file, a pin, not a secret (history: the constant was first named PgdgKeySha256)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/BuildReproducibilityTests\.cs$''']
regexes = ['''^0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76$''']

[[allowlists]]
description = "Fake short key (audit logging configuration test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/AuditLoggingTests\.Config\.cs$''']
regexes = ['''^0123456789ab$''']

[[allowlists]]
description = "Fake GitHub token for redaction (git deploy commands test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/GitDeployCommandsTests\.cs$''']
regexes = ['''^ghp_secretSECRET123$''']

[[allowlists]]
description = "Fake 64-hex key (MCP permission service test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/McpPermissionServiceTests\.cs$''']
regexes = ['''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "Fake VPN auth key GUID (VPN secret handling test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/VpnSecretHandlingTests\.cs$''']
regexes = ['''^A1B2C3D4-E5F6-4789-9ABC-DEF012345678$''']

[[allowlists]]
description = "Fake webhook secret (webhook mutation test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Whiskers\.Tests/WebhookMutationTests\.cs$''']
regexes = ['''^a9c42de780fb$''']

# Names, not values: each the exact text one rule mistakes for a credential, only in its file.
[[allowlists]]
description = "Notification HTTP client name next to MattermostNotificationService, not a Mattermost token"
targetRules = ["mattermost-access-token"]
condition = "AND"
paths = ['''^src/Whiskers/Startup/WhiskersHostingExtensions\.cs$''', '''^src/ServerWatch/Program\.cs$''']
regexes = ['''^DiscordNotificationService$''']

[[allowlists]]
description = "Product names in the secrets inventory of the audit, not a key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/v1/audit/D-secrets-data-backup\.md$''']
regexes = ['''^Tailscale/NetBird$''']
