version: 2
# R1-52: every dependency input of the build is covered here, and BuildReproducibilityTests fails when one is not:
#   nuget          every project in Whiskers.slnx (its directory below) — PackageReferences and packages.lock.json
#   dotnet-sdk     global.json (the SDK version CI and developers build with)
#   docker         the Dockerfile's base images, pinned as tag@sha256 digest (SDK, ASP.NET runtime, docker CLI)
#   docker-compose every image named in a compose file of the repository
#   helm           the Helm chart's images (values.yaml)
#   github-actions every workflow's actions, pinned to full commit SHAs
# A Dependabot PR is only mergeable after the CI suite passed on it (ci.yml restores in locked mode, so a lock file that
# does not match its project fails there).
updates:
  # .NET dependencies: one entry for all projects, so a package shared by several projects moves in one PR.
  # A new project must be added to this list (BuildReproducibilityTests).
  - package-ecosystem: "nuget"
    directories:
      - "/src/Whiskers"
      - "/src/Whiskers.Data"
      - "/src/Whiskers.Migrations.Sqlite"
      - "/src/Whiskers.Migrations.Postgres"
      - "/src/Whiskers.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # The .NET SDK pinned in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  # Base images in the Dockerfile. They are pinned by digest (image:tag@sha256:…); Dependabot moves tag and digest
  # together, also when only the digest behind an unchanged tag changed (a rebuilt runtime image with OS fixes).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  # Images in the compose files: the profiles at the root (docker-socket-proxy), the PostgreSQL compose and the
  # telemetry stacks. A directory with a compose file that names an image must be listed (BuildReproducibilityTests).
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/deploy"
      - "/deploy/telemetry/host"
      - "/deploy/telemetry/victoriametrics"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  # The Helm chart: images in values.yaml (the Tailscale sidecar; Whiskers' own image follows the release).
  - package-ecosystem: "helm"
    directory: "/deploy/helm/whiskers"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "helm"]

  # GitHub Actions in .github/workflows (pinned to commit SHAs; the comment names the release).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
