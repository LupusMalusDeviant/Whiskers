# Chart CI (kubernetesImplement Track A.3): lint + render-invariant checks on every chart change.
# The kind-based install smoke is manual-only (workflow_dispatch) until the first published image
# exists — a `helm install` against a not-yet-released ghcr tag would always fail.
name: chart-ci

on:
  push:
    branches: [main]
    paths: ["deploy/helm/**"]
  pull_request:
    paths: ["deploy/helm/**"]
  workflow_dispatch: {}

# R1-45: nothing at workflow level; each job asks for what it needs. Actions are pinned to full commit SHAs.
permissions: {}

jobs:
  lint-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: helm lint
        run: helm lint deploy/helm/whiskers

      # R1-46: the sidecar is pinned by tag AND digest; both must name the same image, or enabling the sidecar ends in
      # ImagePullBackOff (or runs another build than the tag says).
      - name: Pinned sidecar digest matches its tag
        run: |
          set -euo pipefail
          PIN="$(sed -n 's#^  image: \(tailscale/tailscale:v[0-9.]*\)@\(sha256:[0-9a-f]\{64\}\)$#\1 \2#p' deploy/helm/whiskers/values.yaml)"
          if [ -z "$PIN" ]; then echo "::error::no pinned tailscaleSidecar.image (tag@sha256) in values.yaml"; exit 1; fi
          REF="${PIN% *}"
          WANT="${PIN#* }"
          GOT="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -er .digest)"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::${REF} resolves to ${GOT}, values.yaml pins ${WANT}"; exit 1
          fi
          echo "${REF} = ${WANT}"

      # Golden-invariant checks: render default + full-variant values and assert the properties
      # the chart must never lose (single replica/Recreate, non-root, probes, V4 env, secrets wiring).
      - name: helm template invariants
        run: |
          set -euo pipefail
          # `! cmd` does not stop a `set -e` script when cmd succeeds; refute does.
          refute() { if "$@"; then echo "::error::must fail but succeeded: $*" >&2; exit 1; fi; }
          helm template test deploy/helm/whiskers > default.yaml
          grep -q "type: Recreate" default.yaml
          grep -q "replicas: 1" default.yaml
          grep -q "runAsNonRoot: true" default.yaml
          grep -q "runAsUser: 10001" default.yaml
          grep -q "readOnlyRootFilesystem: true" default.yaml
          grep -q "path: /readyz" default.yaml
          grep -q "path: /healthz" default.yaml
          grep -q "WHISKERS_DISABLE_LOCAL_DOCKER" default.yaml
          refute grep -q "docker.sock" default.yaml
          # R1-34: the startup probe outlasts a pre-upgrade backup + migrations (5 s x 60 = 5 min) and is configurable.
          grep -A3 "startupProbe:" default.yaml | grep -q "failureThreshold: 60"
          helm template test deploy/helm/whiskers --set probes.startup.failureThreshold=240 \
            | grep -A3 "startupProbe:" | grep -q "failureThreshold: 240"
          # R1-46: explicit VPN mode on every render (no legacy tailscaled in a non-root, read-only pod).
          grep -A1 "name: VPN_PROVIDER$" default.yaml | grep -q 'value: "none"'
          grep -A1 "name: Vpn__Provider$" default.yaml | grep -q 'value: "none"'
          refute grep -q ":latest" default.yaml
          # R1-46: renders that cannot work are refused (fail closed), not deployed.
          refute helm template test deploy/helm/whiskers --set database.provider=postgres > /dev/null 2>&1
          refute helm template test deploy/helm/whiskers --set tailscaleSidecar.enabled=true \
            --set tailscaleSidecar.authKeySecret=ts-auth --set tailscaleSidecar.image=tailscale/tailscale:latest > /dev/null 2>&1
          refute helm template test deploy/helm/whiskers --set "extraEnv[0].name=VPN_PROVIDER" \
            --set "extraEnv[0].value=tailscale" > /dev/null 2>&1

          helm template test deploy/helm/whiskers \
            --set database.provider=postgres \
            --set database.connectionString="Host=pg;Database=whiskers" \
            --set vault.key=testkey \
            --set ingress.enabled=true \
            --set "ingress.hosts[0].host=w.example.com" \
            --set "ingress.hosts[0].paths[0].path=/" \
            --set tailscaleSidecar.enabled=true \
            --set tailscaleSidecar.authKeySecret=ts-auth \
            --set localDocker.enabled=true \
            --set "trustedProxyCidrs[0]=10.42.0.0/16" > full.yaml
          grep -q "WHISKERS_DB_PROVIDER" full.yaml
          grep -q "kind: Ingress" full.yaml
          grep -q "TS_USERSPACE" full.yaml
          # R1-46: pinned sidecar, node state on its own PVC (containerboot's Secret storage off).
          refute grep -q "tailscale:latest" full.yaml
          grep -q "image: \"tailscale/tailscale:v[0-9.]*@sha256:" full.yaml
          grep -A1 "name: TS_KUBE_SECRET$" full.yaml | grep -q 'value: ""'
          grep -q "claimName: test-whiskers-tailscale" full.yaml
          # The auth key reaches `tailscale up` as a file path, never as a value on its command line.
          grep -A1 "name: TS_AUTHKEY$" full.yaml | grep -q 'value: "file:/run/secrets/tailscale/authKey"'
          grep -q "ForwardedHeaders__TrustedNetworks__0" full.yaml
          grep -q "docker.sock" full.yaml
          refute grep -q "WHISKERS_DISABLE_LOCAL_DOCKER" full.yaml
          echo "all render invariants hold"

  # Manual smoke: spin up a kind cluster, helm install, wait for /readyz. Requires a published
  # image (first v* release) — run via the Actions UI after tagging.
  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Install chart and wait for readiness
        run: |
          set -euo pipefail
          helm install whiskers deploy/helm/whiskers \
            --set vault.key=ci-smoke-test-key \
            --wait --timeout 5m
          kubectl get pods -o wide
          kubectl port-forward svc/whiskers 8080:8080 &
          sleep 5
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS -o /dev/null -w "login page: %{http_code}\n" http://127.0.0.1:8080/
