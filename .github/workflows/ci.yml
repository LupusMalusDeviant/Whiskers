# CI: build + full test suite on every push/PR against main. This is the gate that makes
# Dependabot PRs safely mergeable — without it nothing validated dependency bumps.
#
# R1-45: the release workflow calls this file (`workflow_call`) with the tag commit as `ref`, so a release is
# only published after exactly this suite passed on the commit it ships. Every action is pinned to a full
# commit SHA (the comment names the release); Dependabot keeps the pins current.
#
# R1-47: fail closed. The suite runs in two parts, each checked from its TRX file (check-test-results.sh): the in-process
# tests (a floor of passed tests, nothing failed) and the Docker-backed integration tests — PostgreSQL metrics, Identity,
# backup/restore — where a missing Docker daemon or database fails the job and not a single test may be skipped. Both
# parts also name their mandatory tests (.github/required-tests/): each must be in the run and pass, whatever the floor. The
# `artifact` job builds the image and checks the deliverable itself (Trivy, hardened profile, N-1 upgrade and recovery);
# in a release the same checks run against the staged digest instead (release.yml `artifact-test`). Every job is bounded.
#
# R1-51 (contract 0008): the release gate (ReleaseGateTests) runs inside the in-process tests. Its mode follows the
# version; only release.yml makes a run a release run, through the input `release-gate: release`, which this file turns
# into WHISKERS_RELEASE_GATE for the in-process step and nowhere else. On a pull request and in a release run the records
# are also compared with a base (the pull request's base commit, or the previous release tag).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Commit to build and test (the release workflow passes the tag commit). Empty = the event's ref."
        required: false
        type: string
        default: ""
      release-gate:
        description: "'release' in a release run (release.yml); empty otherwise. Can only make the release gate stricter."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # R1-52: locked restore — exactly the packages.lock.json of every project, or the job fails. The script retries only
      # a transient failure (a nuget.org connection reset); a lock-file or content-hash mismatch fails at once.
      - name: Restore
        run: bash .github/scripts/restore-locked.sh

      - name: Build
        run: dotnet build Whiskers.slnx --no-restore --configuration Release

      # R1-33: the PostgreSQL backup/restore tests drive pg_dump/pg_restore/psql against a Testcontainers
      # server. The same client major as the image (PGDG), so CI proves what ships.
      - name: PostgreSQL client tools
        run: |
          set -euo pipefail
          . /etc/os-release
          # The PGDG signing key is committed (deploy/keys/, the same file the Dockerfile uses): no download from
          # postgresql.org, and the key is pinned — the whole file by SHA-256 and its fingerprint — before apt trusts it.
          echo "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76  deploy/keys/pgdg-ACCC4CF8.asc" | sha256sum -c -
          gpg --show-keys --with-colons deploy/keys/pgdg-ACCC4CF8.asc | grep '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:$' >/dev/null
          sudo gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg deploy/keys/pgdg-ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "WHISKERS_PG_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --version

      # The floor guards against a silently-empty or shrunken run: with the test project missing from Whiskers.slnx,
      # `dotnet test --no-build` once exited 0 without executing any test. Raise it when the suite grows.
      - name: Test (in-process)
        env:
          WHISKERS_RELEASE_GATE: ${{ inputs.release-gate }}
        run: |
          set -euo pipefail
          dotnet test src/Whiskers.Tests/Whiskers.Tests.csproj --no-build --configuration Release \
            --filter "Category!=RequiresDocker" --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=in-process.trx" --results-directory TestResults
          bash .github/scripts/check-test-results.sh TestResults/in-process.trx 3000 --require .github/required-tests/in-process.txt

      # PostgreSQL metrics, Identity and backup/restore against real servers (Testcontainers). Mandatory: without Docker
      # the tests throw on CI (CI=true), and the check refuses any skipped test in this category.
      - name: Test (Docker integration, mandatory)
        run: |
          set -euo pipefail
          docker info --format 'Docker {{.ServerVersion}}' || { echo "::error::no Docker daemon: the integration suite cannot run"; exit 1; }
          dotnet test src/Whiskers.Tests/Whiskers.Tests.csproj --no-build --configuration Release \
            --filter "Category=RequiresDocker" --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=docker.trx" --results-directory TestResults
          bash .github/scripts/check-test-results.sh TestResults/docker.trx 70 --no-skips --require .github/required-tests/docker.txt

      # Contract 0013, § 4: the compose pin (image id in `image:`) on the minimum Compose, v2.15 — the runner's own Compose
      # is far newer. The official release binary, checked against its pinned SHA-256 before it runs (a mismatch stops the
      # job), is the `docker compose` CLI plugin of a separate DOCKER_CONFIG; the test fails on any other version
      # (WHISKERS_TEST_COMPOSE_VERSION), so a plugin that is not picked up cannot pass as v2.15.
      - name: Test (compose pin on the minimum Compose)
        env:
          COMPOSE_MIN_VERSION: "2.15.1"
          COMPOSE_MIN_SHA256: "bcfd9ea51dee4c19dccdfaeef0e7956ef68bf14f3d175933742061a7271ef0f5"
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/compose-min"
          mkdir -p "$config/cli-plugins"
          curl -fsSL --retry 3 -o "$config/cli-plugins/docker-compose" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_MIN_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_MIN_SHA256}  $config/cli-plugins/docker-compose" | sha256sum -c - \
            || { echo "::error::docker-compose v${COMPOSE_MIN_VERSION} does not match its pinned SHA-256"; exit 1; }
          chmod 755 "$config/cli-plugins/docker-compose"
          export DOCKER_CONFIG="$config"
          docker compose version
          WHISKERS_TEST_COMPOSE_VERSION="$COMPOSE_MIN_VERSION" \
            dotnet test src/Whiskers.Tests/Whiskers.Tests.csproj --no-build --configuration Release \
            --filter "FullyQualifiedName~Whiskers.Tests.ComposePinIntegrationTests" --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=compose-min.trx" --results-directory TestResults
          bash .github/scripts/check-test-results.sh TestResults/compose-min.trx 2 --no-skips

      # R1-51 (contract 0008, D16 and R18): no invariant ID disappears without a retirement, the pinned highest ID never goes
      # down, and an accepted release decision is never edited — compared with the pull request's base commit, or in a
      # release run with the previous release: the highest published GitHub release below the version that is an ancestor
      # of the release commit and carries its tag's version (ancestry and version are the guarantee; the published list only
      # screens out failed releases). History, tags and the release list are fetched only in a release run, and the token
      # is passed to `gh release list` alone and unset before the tests run, so it is not in the tests' environment (the
      # checkout's persisted credentials still hold the same read-only token).
      - name: Release gate (compare with the base)
        if: github.event_name == 'pull_request' || inputs.release-gate == 'release'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_GATE: ${{ inputs.release-gate }}
          RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_GATE" = "release" ]; then
            git fetch --no-tags --unshallow origin '+refs/tags/v*:refs/tags/v*'
            GH_TOKEN="$RELEASES_TOKEN" gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/releases.txt"
            export WHISKERS_GATE_RELEASES="$RUNNER_TEMP/releases.txt"
            export WHISKERS_GATE_BASE=previous-tag
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            export WHISKERS_GATE_BASE="$BASE_SHA"
          fi
          unset RELEASES_TOKEN
          export WHISKERS_GATE_BASE_REQUIRED=true
          dotnet test src/Whiskers.Tests/Whiskers.Tests.csproj --no-build --configuration Release \
            --filter "FullyQualifiedName~Whiskers.Tests.ReleaseGate.ReleaseGateBaseTests" --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=gate-base.trx" --results-directory TestResults
          bash .github/scripts/check-test-results.sh TestResults/gate-base.trx 1 --no-skips

      # DI boot gate (project rule): build+tests miss DI-graph regressions — boot the app in
      # Development (ValidateOnBuild/ValidateScopes) against a fresh data dir until /healthz answers.
      - name: DI boot gate
        run: |
          set -euo pipefail
          export WHISKERS_DATA_DIR="$(mktemp -d)"
          export Auth__Disabled=true
          export ASPNETCORE_ENVIRONMENT=Development
          dotnet run --project src/Whiskers/Whiskers.csproj --no-build --configuration Release --urls http://127.0.0.1:5199 &
          APP_PID=$!
          for i in $(seq 1 45); do
            sleep 2
            if curl -fsS http://127.0.0.1:5199/healthz >/dev/null 2>&1; then
              echo "healthy"; kill $APP_PID; exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then echo "app exited early"; exit 1; fi
          done
          echo "healthz never became ready"; kill $APP_PID; exit 1

  # R1-47: the deliverable itself. Build the image from this commit (amd64, loaded into the runner's Docker), gate it on
  # Trivy like the release does, start it with the hardened compose profile, and upgrade the previous published release's
  # data with it and back (.github/scripts/artifact-checks.sh). Skipped when the release calls this workflow (a tag ref):
  # there release.yml `artifact-test` runs the same checks against the staged digest it publishes.
  artifact:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      ARTIFACT: whiskers:ci-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (amd64, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ARTIFACT }}
          # The layer cache speeds up the runtime stage only. The `build` stage (the NuGet restore) is never taken from it:
          # a cached restore layer is a NuGet package cache, and a cache hit skips NuGet's hash and signature checks.
          # mode=min exports only the final image's (runtime) layers: the build stage is never read back, so not stored.
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,scope=ci-amd64,mode=min
          no-cache-filters: build

      - name: Trivy scan (gate, fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.ARTIFACT }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore

      # The checks below print only text they write themselves; planted values must not reach this log by any path.
      - name: Disclosure self-test
        run: bash .github/scripts/artifact-checks.sh self-test

      - name: Hardened profile
        run: bash .github/scripts/artifact-checks.sh hardened "$ARTIFACT"

      - name: N-1 upgrade and recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # N-1 is the highest published release BELOW this build's version: the same release is rightly no upgrade.
          VER="$(sed -n 's:.*<Version>\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)</Version>.*:\1:p' src/Whiskers/Whiskers.csproj | head -n1)"
          [ -n "$VER" ] || { echo "::error::no <Version> in src/Whiskers/Whiskers.csproj"; exit 1; }
          PREVIOUS="$(bash .github/scripts/artifact-checks.sh previous-release "$VER")"
          echo "previous release: ${PREVIOUS}"
          bash .github/scripts/artifact-checks.sh upgrade "$ARTIFACT" "$PREVIOUS"

  # R1-52: the image carries the runtime tools Whiskers starts and nothing of the Docker engine. Built from this commit
  # and driven through the real terminal, host-shell, compose-deploy and VPN paths (ImageRuntimeToolsTests, category
  # ImageRuntime). Required here: a missing image, daemon or host compose fails these tests instead of skipping them.
  # Both release architectures, each on a native runner, so an arm64-only breakage is caught before the merge.
  image-runtime:
    name: image-runtime (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the test project
        run: |
          set -euo pipefail
          bash .github/scripts/restore-locked.sh
          dotnet build src/Whiskers.Tests/Whiskers.Tests.csproj --no-restore --configuration Release

      - name: Build the image
        run: docker build -t whiskers:image-runtime .

      - name: Image runtime tests
        env:
          WHISKERS_IMAGE: whiskers:image-runtime
          WHISKERS_IMAGE_TESTS_REQUIRED: "true"
        run: |
          set -euo pipefail
          dotnet test src/Whiskers.Tests/Whiskers.Tests.csproj --no-build --configuration Release \
            --filter "Category=ImageRuntime" --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=image-runtime.trx" --results-directory TestResults
          # R1-51 (contract 0008, D14): checked from the TRX file like the other suites — a floor, no skip, and the
          # required tests of image-runtime.txt (the image tests invariants may name are rendered into its block).
          bash .github/scripts/check-test-results.sh TestResults/image-runtime.trx 7 --no-skips --require .github/required-tests/image-runtime.txt
