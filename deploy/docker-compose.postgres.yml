# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL overlay — use ON TOP OF docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.postgres.yml up -d
#
# Starts a postgres service and points Whiskers at it via WHISKERS_DB_PROVIDER.
# SQLite stays the zero-config default whenever this overlay is NOT used.
# Set WHISKERS_DB_PASSWORD in your .env; the other DB_* values have defaults.
# See docs/adr/0004-postgres-provider-support.md for the provider architecture.
#
# PostgreSQL 18. Coming from the PostgreSQL 17 overlay (volume whiskers-db-data)? Follow
# docs/operations/postgres-18-upgrade.md. Until you do, db-upgrade-guard keeps the database (and so Whiskers) from
# starting while your data sits in the 17 volume and the guard has not itself restored a dump of exactly that 17 data
# into the 18 volume. The new overlay never mounts the 17 volume writable: it stays as your way back.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Decides whether PostgreSQL 18 may start: a blind pull of this file must not look like a fresh install, and a
  # rollback to 17 must not be followed by a start on the older 18 copy. Three modes:
  # - Normal run (the dependency of db): passes when whiskers-db-data is empty, or when it holds a 17 cluster whose
  #   global/pg_control fingerprint equals the marker the restore mode wrote. Refuses everything else.
  # - Fingerprint mode, after the dump with 17 stopped (docs/operations/postgres-18-upgrade.md, step 1):
  #     docker compose ... run --rm --no-deps -T -e WHISKERS_FINGERPRINT=1 db-upgrade-guard >> whiskers-pg17.sql
  #   prints one SQL comment line with the 17 cluster's fingerprint, binding the dump to that state.
  # - Restore mode, with the 18 db running (step 2):
  #     docker compose ... run --rm --no-deps -T -e WHISKERS_RESTORE=1 db-upgrade-guard < whiskers-pg17.sql
  #   checks the dump (complete, fingerprint of the current 17 data) and the server (PostgreSQL 18, no Whiskers tables
  #   yet), restores in one transaction, checks the migration history, and only then writes the marker.
  db-upgrade-guard:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        guide="docs/operations/postgres-18-upgrade.md"
        marker=/new/.whiskers-restored-from-17
        tag="-- whiskers-pg17-control: "
        say() { echo "whiskers: $$*" >&2; }
        refuse() {
          for line in "$$@"; do say "$$line"; done
          say "The volumes are whiskers-db-data (PostgreSQL 17) and whiskers-db18-data (PostgreSQL 18); docker volume ls shows them with your compose project as a prefix."
          exit 1
        }
        q() { PGCONNECT_TIMEOUT=10 psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -tA "$$@"; }
        mode=normal
        [ "$${WHISKERS_FINGERPRINT:-}" = 1 ] && mode=fingerprint
        [ "$${WHISKERS_RESTORE:-}" = 1 ] && mode=restore
        if ! entries=$$(ls -A /old 2>/dev/null); then
          refuse "cannot list the PostgreSQL 17 volume whiskers-db-data; not starting." "See $$guide."
        fi
        if [ -z "$$entries" ]; then
          if [ "$$mode" != normal ]; then
            refuse "no PostgreSQL 17 data in whiskers-db-data: there is nothing to fingerprint or restore."
          fi
          exit 0
        fi
        if ! found=$$(find /old -maxdepth 2 -name PG_VERSION -type f); then
          refuse "cannot search the PostgreSQL 17 volume whiskers-db-data; not starting." "See $$guide."
        fi
        if [ -z "$$found" ]; then
          refuse "unrecognised content in whiskers-db-data (no PostgreSQL data directory); not starting." "See $$guide."
        fi
        if [ "$$(printf '%s\n' "$$found" | wc -l)" -ne 1 ]; then
          refuse "more than one PostgreSQL data directory in whiskers-db-data; not starting." "See $$guide."
        fi
        cluster=$$(dirname "$$found")
        if ! sum=$$(sha256sum "$$cluster/global/pg_control" 2>/dev/null); then
          refuse "cannot read global/pg_control of the PostgreSQL data in whiskers-db-data; not starting." "See $$guide."
        fi
        fp=$${sum%% *}
        if [ "$$mode" = fingerprint ]; then
          if [ -e "$$cluster/postmaster.pid" ]; then
            refuse "PostgreSQL 17 is running on whiskers-db-data (postmaster.pid); its fingerprint would change at the stop. Stop PostgreSQL 17 first: c17 stop -t 120 db." "If c17 ps db lists nothing (c17 ps -a db shows it Exited), it was not shut down cleanly: run step 1 of $$guide again from the top."
          fi
          printf '%s\n' "$$tag$$fp"
          exit 0
        fi
        if [ "$$mode" = restore ]; then
          umask 077
          if ! dump=$$(mktemp /tmp/whiskers-pg17.XXXXXX) || ! cat > "$$dump"; then
            refuse "could not read the dump from standard input; nothing restored."
          fi
          if ! grep -q 'PostgreSQL database dump complete' "$$dump"; then
            refuse "the dump is incomplete (no 'PostgreSQL database dump complete'); nothing restored."
          fi
          if [ "$$(grep -c "^$$tag" "$$dump")" != 1 ]; then
            refuse "the dump needs exactly one line '$$tag<fingerprint>' (step 1 of $$guide); nothing restored."
          fi
          line=$$(grep "^$$tag" "$$dump")
          if [ "$${line#"$$tag"}" != "$$fp" ]; then
            refuse "the dump is not of the current PostgreSQL 17 data (17 ran again after the dump?); take a new dump (step 1 of $$guide); nothing restored."
          fi
          if ! version=$$(q -c "select current_setting('server_version_num')::int"); then
            refuse "could not reach the PostgreSQL 18 database (is db up?); nothing restored."
          fi
          case "$$version" in
            ''|*[!0-9]*) refuse "unexpected answer from the database server: $$version; nothing restored." ;;
          esac
          if [ "$$version" -lt 180000 ]; then
            refuse "the database server at db is PostgreSQL $$version, not 18 (is the 17 db still running?); nothing restored."
          fi
          if ! empty=$$(q -c "select to_regclass('public.\"__EFMigrationsHistory\"') is null"); then
            refuse "could not inspect the PostgreSQL 18 database; nothing restored."
          fi
          if [ "$$empty" != t ]; then
            refuse "the PostgreSQL 18 database already holds Whiskers' tables (did Whiskers start on it?); remove the 18 volume and start again ($$guide); nothing restored."
          fi
          if ! q --single-transaction -q -f "$$dump" >/dev/null; then
            refuse "the restore failed and was rolled back; nothing restored. Fix the cause and run the restore again."
          fi
          rows=$$(q -c 'select count(*) from "__EFMigrationsHistory"' 2>/dev/null)
          case "$$rows" in
            ''|*[!0-9]*|0) refuse "the dump was restored but holds no Whiskers migration history; not marking it. Remove the 18 volume and start again ($$guide)." ;;
          esac
          if ! { printf '%s\n' "$$fp" > "$$marker.tmp" && mv "$$marker.tmp" "$$marker"; }; then
            refuse "the dump was restored, but the marker could not be written into whiskers-db18-data. Remove the 18 volume and run the restore again ($$guide)."
          fi
          say "restored: $$rows migrations in the PostgreSQL 18 database; marker written for the PostgreSQL 17 data in whiskers-db-data."
          exit 0
        fi
        if [ ! -f "$$marker" ]; then
          refuse "PostgreSQL $$(cat "$$found") data found in the volume whiskers-db-data, and the PostgreSQL 18 volume whiskers-db18-data holds no restore of it." "not starting an empty database. Follow $$guide (dump, restore, start)."
        fi
        if [ "$$(cat "$$marker" 2>/dev/null)" != "$$fp" ]; then
          refuse "the PostgreSQL 17 data changed after the upgrade (a rollback?). Whiskers will not start on the older 18 copy; to upgrade again remove the 18 volume and follow $$guide."
        fi
        exit 0
    environment:
      # The same values as db: the restore mode connects with them.
      - POSTGRES_DB=${WHISKERS_DB_NAME:-whiskers}
      - POSTGRES_USER=${WHISKERS_DB_USER:-whiskers}
      - PGPASSWORD=${WHISKERS_DB_PASSWORD:?set WHISKERS_DB_PASSWORD in your .env}
    volumes:
      - whiskers-db-data:/old:ro
      # Writable for the restore mode's marker only; the other modes only read it.
      - whiskers-db18-data:/new
    restart: "no"

  db:
    image: postgres:18-alpine
    container_name: whiskers-db
    environment:
      - POSTGRES_DB=${WHISKERS_DB_NAME:-whiskers}
      - POSTGRES_USER=${WHISKERS_DB_USER:-whiskers}
      - POSTGRES_PASSWORD=${WHISKERS_DB_PASSWORD:?set WHISKERS_DB_PASSWORD in your .env}
    volumes:
      # 18+: one mount at /var/lib/postgresql (the data lives in 18/docker below it), so a later major upgrade can use
      # pg_upgrade --link inside one volume. The image refuses a mount at /var/lib/postgresql/data.
      - whiskers-db18-data:/var/lib/postgresql
    healthcheck:
      # Gate the app's depends_on on a genuinely accepting server, not just a running container. Over TCP: the image's
      # temporary init server listens on the unix socket only, so this cannot report it as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${WHISKERS_DB_USER:-whiskers} -d ${WHISKERS_DB_NAME:-whiskers}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db-upgrade-guard:
        condition: service_completed_successfully
    restart: unless-stopped

  # Must match the app service name in docker-compose.yml (pre-rebrand `serverwatch`, kept for existing installs).
  serverwatch:
    environment:
      - WHISKERS_DB_PROVIDER=postgres
      - WHISKERS_DB_CONNECTION=Host=db;Port=5432;Database=${WHISKERS_DB_NAME:-whiskers};Username=${WHISKERS_DB_USER:-whiskers};Password=${WHISKERS_DB_PASSWORD:?set WHISKERS_DB_PASSWORD in your .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  # PostgreSQL 17 data of installs from before the move to 18: mounted read-only by db-upgrade-guard, never written by
  # this overlay. Remove it yourself once the upgrade is verified (docs/operations/postgres-18-upgrade.md); note that
  # `down -v` removes it too.
  whiskers-db-data:
  whiskers-db18-data:
