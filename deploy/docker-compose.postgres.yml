# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL overlay — use ON TOP OF docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.postgres.yml up -d
#
# Starts a postgres service and points Whiskers at it via WHISKERS_DB_PROVIDER.
# SQLite stays the zero-config default whenever this overlay is NOT used.
# Set WHISKERS_DB_PASSWORD in your .env; the other DB_* values have defaults.
# See docs/adr/0004-postgres-provider-support.md for the provider architecture.
#
# PostgreSQL 18. Coming from the PostgreSQL 17 overlay (volume whiskers-db-data)? Follow
# docs/operations/postgres-18-upgrade.md. Until you do, db-upgrade-guard keeps the database (and so Whiskers) from
# starting while your data sits in the 17 volume and no restore of it into the 18 volume has been confirmed. The new
# overlay never mounts the 17 volume writable: it stays as your way back.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Decides whether PostgreSQL 18 may start: a blind pull of this file must not look like a fresh install, and a
  # rollback to 17 must not be followed by a start on the older 18 copy.
  # - Normal run (the dependency of db): passes when whiskers-db-data is empty, or when it holds a 17 cluster whose
  #   global/pg_control fingerprint equals the marker written by a confirmed restore. Refuses everything else.
  # - Confirm run, after the restore (docs/operations/postgres-18-upgrade.md):
  #     docker compose ... run --rm --no-deps -e WHISKERS_CONFIRM_RESTORE=1 db-upgrade-guard
  #   checks over the network that the running 18 database holds Whiskers' migration history, and only then writes the
  #   17 cluster's fingerprint into the 18 volume.
  db-upgrade-guard:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        guide="docs/operations/postgres-18-upgrade.md"
        marker=/new/.whiskers-restored-from-17
        say() { echo "whiskers: $$*" >&2; }
        refuse() {
          for line in "$$@"; do say "$$line"; done
          say "The volumes are whiskers-db-data (PostgreSQL 17) and whiskers-db18-data (PostgreSQL 18); docker volume ls shows them with your compose project as a prefix."
          exit 1
        }
        if ! entries=$$(ls -A /old 2>/dev/null); then
          refuse "cannot list the PostgreSQL 17 volume whiskers-db-data; not starting." "See $$guide."
        fi
        if [ -z "$$entries" ]; then
          if [ "$${WHISKERS_CONFIRM_RESTORE:-}" = 1 ]; then
            refuse "no PostgreSQL 17 data in whiskers-db-data: there is no restore to confirm."
          fi
          exit 0
        fi
        if ! found=$$(find /old -maxdepth 2 -name PG_VERSION -type f); then
          refuse "cannot search the PostgreSQL 17 volume whiskers-db-data; not starting." "See $$guide."
        fi
        if [ -z "$$found" ]; then
          refuse "unrecognised content in whiskers-db-data (no PostgreSQL data directory); not starting." "See $$guide."
        fi
        if [ "$$(printf '%s\n' "$$found" | wc -l)" -ne 1 ]; then
          refuse "more than one PostgreSQL data directory in whiskers-db-data; not starting." "See $$guide."
        fi
        cluster=$$(dirname "$$found")
        if ! sum=$$(sha256sum "$$cluster/global/pg_control" 2>/dev/null); then
          refuse "cannot read global/pg_control of the PostgreSQL data in whiskers-db-data; not starting." "See $$guide."
        fi
        fp=$${sum%% *}
        if [ "$${WHISKERS_CONFIRM_RESTORE:-}" = 1 ]; then
          if ! rows=$$(PGCONNECT_TIMEOUT=10 psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc 'select count(*) from "__EFMigrationsHistory"'); then
            refuse "could not read Whiskers' migration history from the running PostgreSQL 18 database (is db up, and the restore done?); nothing confirmed."
          fi
          case "$$rows" in
            ''|*[!0-9]*) refuse "unexpected answer from the PostgreSQL 18 database: $$rows; nothing confirmed." ;;
          esac
          if [ "$$rows" -lt 1 ]; then
            refuse "the PostgreSQL 18 database has an empty migration history: the restore did not happen; nothing confirmed."
          fi
          if ! { printf '%s\n' "$$fp" > "$$marker.tmp" && mv "$$marker.tmp" "$$marker"; }; then
            refuse "could not write the marker into whiskers-db18-data; nothing confirmed."
          fi
          say "restore confirmed: $$rows migrations in the PostgreSQL 18 database; marker written for the PostgreSQL 17 data in whiskers-db-data."
          exit 0
        fi
        if [ ! -f "$$marker" ]; then
          refuse "PostgreSQL $$(cat "$$found") data found in the volume whiskers-db-data, and the PostgreSQL 18 volume whiskers-db18-data holds no confirmed restore of it." "not starting an empty database. Follow $$guide (dump, restore, confirm, start)."
        fi
        if [ "$$(cat "$$marker" 2>/dev/null)" != "$$fp" ]; then
          refuse "the PostgreSQL 17 data changed after the upgrade (a rollback?). Whiskers will not start on the older 18 copy; to upgrade again remove the 18 volume and follow $$guide."
        fi
        exit 0
    environment:
      # The same values as db: the confirm run checks the restored database with them.
      - POSTGRES_DB=${WHISKERS_DB_NAME:-whiskers}
      - POSTGRES_USER=${WHISKERS_DB_USER:-whiskers}
      - PGPASSWORD=${WHISKERS_DB_PASSWORD:?set WHISKERS_DB_PASSWORD in your .env}
    volumes:
      - whiskers-db-data:/old:ro
      # Writable for the confirm run's marker only; the normal run only reads it.
      - whiskers-db18-data:/new
    restart: "no"

  db:
    image: postgres:18-alpine
    container_name: whiskers-db
    environment:
      - POSTGRES_DB=${WHISKERS_DB_NAME:-whiskers}
      - POSTGRES_USER=${WHISKERS_DB_USER:-whiskers}
      - POSTGRES_PASSWORD=${WHISKERS_DB_PASSWORD:?set WHISKERS_DB_PASSWORD in your .env}
    volumes:
      # 18+: one mount at /var/lib/postgresql (the data lives in 18/docker below it), so a later major upgrade can use
      # pg_upgrade --link inside one volume. The image refuses a mount at /var/lib/postgresql/data.
      - whiskers-db18-data:/var/lib/postgresql
    healthcheck:
      # Gate the app's depends_on on a genuinely accepting server, not just a running container. Over TCP: the image's
      # temporary init server listens on the unix socket only, so this cannot report it as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${WHISKERS_DB_USER:-whiskers} -d ${WHISKERS_DB_NAME:-whiskers}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db-upgrade-guard:
        condition: service_completed_successfully
    restart: unless-stopped

  # Must match the app service name in docker-compose.yml (pre-rebrand `serverwatch`, kept for existing installs).
  serverwatch:
    environment:
      - WHISKERS_DB_PROVIDER=postgres
      - WHISKERS_DB_CONNECTION=Host=db;Port=5432;Database=${WHISKERS_DB_NAME:-whiskers};Username=${WHISKERS_DB_USER:-whiskers};Password=${WHISKERS_DB_PASSWORD:?set WHISKERS_DB_PASSWORD in your .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  # PostgreSQL 17 data of installs from before the move to 18: mounted read-only by db-upgrade-guard, never written by
  # this overlay. Remove it yourself once the upgrade is verified (docs/operations/postgres-18-upgrade.md); note that
  # `down -v` removes it too.
  whiskers-db-data:
  whiskers-db18-data:
