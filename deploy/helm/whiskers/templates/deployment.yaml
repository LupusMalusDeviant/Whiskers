{{- include "whiskers.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whiskers.fullname" . }}
  labels:
    {{- include "whiskers.labels" . | nindent 4 }}
spec:
  # Single replica by design for 1.0 (Blazor Server circuits, stateful background loops, SQLite/
  # JSON stores on one PVC). Recreate prevents two writers during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "whiskers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "whiskers.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "whiskers.serviceAccountName" . }}
      # R1-39: Whiskers drains running unattended work for up to 30 s, then stops (45 s in all).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # PVC ownership — without this a fresh volume is root-owned and unwritable for uid 10001.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whiskers
          image: {{ include "whiskers.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: WHISKERS_DATA_DIR
              value: /app/data
            # R1-46: explicit VPN mode, both names (entrypoint.sh decides on VPN_PROVIDER, Whiskers on Vpn__Provider).
            # Non-root on a read-only root file system the legacy tailscaled bring-up cannot work, and the in-app
            # providers are not supported here: nobody brings a VPN up in this container. Mesh = the sidecar below.
            - name: VPN_PROVIDER
              value: "none"
            - name: Vpn__Provider
              value: "none"
            {{- if not .Values.localDocker.enabled }}
            # V4: no Docker socket in the pod — start without the default "local" server.
            - name: WHISKERS_DISABLE_LOCAL_DOCKER
              value: "true"
            {{- end }}
            {{- if eq .Values.database.provider "postgres" }}
            - name: WHISKERS_DB_PROVIDER
              value: postgres
            - name: WHISKERS_DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-db" (include "whiskers.fullname" .)) }}
                  key: connectionString
            {{- end }}
            {{- if or .Values.vault.existingSecret .Values.vault.key }}
            - name: VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.existingSecret | default (printf "%s-vault" (include "whiskers.fullname" .)) }}
                  key: vaultKey
            {{- end }}
            {{- if and .Values.auth.adminEmail .Values.auth.adminPasswordSecret }}
            - name: WHISKERS_ADMIN_EMAIL
              value: {{ .Values.auth.adminEmail | quote }}
            - name: WHISKERS_ADMIN_PASSWORD_FILE
              value: /run/secrets/whiskers-admin/adminPassword
            {{- end }}
            {{- range $i, $cidr := .Values.trustedProxyCidrs }}
            - name: ForwardedHeaders__TrustedNetworks__{{ $i }}
              value: {{ $cidr | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            # readOnlyRootFilesystem needs a writable /tmp (same trick as the hardened compose).
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.auth.adminEmail .Values.auth.adminPasswordSecret }}
            - name: admin-password
              mountPath: /run/secrets/whiskers-admin
              readOnly: true
            {{- end }}
            {{- if .Values.localDocker.enabled }}
            # WARNING: root-equivalent control over this node's Docker + pins the pod to the node.
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
          # Probes (values.probes): the startupProbe outlasts the pre-upgrade backup and the schema migrations of
          # a new release (R1-34, default 5 min); liveness is deliberately lazy so a busy Blazor app is not probed
          # to death.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.tailscaleSidecar.enabled }}
        # Userspace networking: no /dev/net/tun, no NET_ADMIN — good enough for OUTBOUND
        # connections from Whiskers to the mesh-connected fleet.
        - name: tailscale
          image: {{ .Values.tailscaleSidecar.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_HOSTNAME
              value: {{ .Values.tailscaleSidecar.hostname | quote }}
            # R1-46: the auth key as a file, never as a value. containerboot passes TS_AUTHKEY on to
            # `tailscale up --authkey=<TS_AUTHKEY>` (v1.104.4, cmd/containerboot/tailscaled.go), so a literal key would be
            # on that command line; with "file:<path>" the CLI reads the key from the file and only the path is in argv.
            - name: TS_AUTHKEY
              value: "file:/run/secrets/tailscale/authKey"
            # The node's state lives in TS_STATE_DIR (a PVC unless tailscaleSidecar.state.persistent=false). Inside
            # Kubernetes containerboot would otherwise store it in a Secret named "tailscale" (TS_KUBE_SECRET's
            # default), which needs RBAC this chart does not grant: an explicitly empty value turns that off.
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            {{- if .Values.tailscaleSidecar.state.persistent }}
            # Log in with the auth key only when the persisted node is not logged in yet: a restart keeps its identity.
            - name: TS_AUTH_ONCE
              value: "true"
            {{- end }}
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-authkey
              mountPath: /run/secrets/tailscale
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "whiskers.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.auth.adminEmail .Values.auth.adminPasswordSecret }}
        - name: admin-password
          secret:
            secretName: {{ .Values.auth.adminPasswordSecret }}
        {{- end }}
        {{- if .Values.localDocker.enabled }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
        {{- if .Values.tailscaleSidecar.enabled }}
        - name: tailscale-state
          {{- if .Values.tailscaleSidecar.state.persistent }}
          persistentVolumeClaim:
            claimName: {{ include "whiskers.tailscaleStateClaim" . }}
          {{- else }}
          # Not persistent (tailscaleSidecar.state.persistent=false): a new tailnet node at every restart.
          emptyDir: {}
          {{- end }}
        # The auth key Secret as a file: 0440, owned by root and the pod's fsGroup 10001 — readable by the sidecar's
        # uid/gid 10001, not by others.
        - name: tailscale-authkey
          secret:
            secretName: {{ required "tailscaleSidecar.authKeySecret is required when the sidecar is enabled" .Values.tailscaleSidecar.authKeySecret }}
            defaultMode: 0440
            items:
              - key: authKey
                path: authKey
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
