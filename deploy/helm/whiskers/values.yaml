# Whiskers Helm values (kubernetesImplement Track A).
#
# Architecture decisions baked in (do not "fix"):
# - replicas: 1 + strategy Recreate — Blazor Server circuits, background loops and the SQLite/
#   JSON-store data dir make multi-replica wrong for 1.0. HA is a post-1.0 topic.
# - No Docker socket by default: on K8s, Whiskers is the control plane for REMOTE Docker hosts
#   (SSH bootstrap / TCP+mTLS / mesh) and Kubernetes clusters. localDocker.enabled=true is the
#   explicit, warned-about exception.

image:
  repository: ghcr.io/lupusmalusdeviant/whiskers
  # "" = use the chart's appVersion (the release this chart was published with). "latest" is refused.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The /app/data volume: SQLite DB, JSON stores, keys, certs. Survives pod restarts.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  # Use an existing PVC instead of creating one.
  existingClaim: ""

database:
  # sqlite (zero-config, on the PVC) | postgres (external; recommended for bigger fleets). Anything else is refused.
  provider: sqlite
  # Secret with key "connectionString" for postgres. Preferred over inline connectionString. postgres needs one of
  # the two: without either the chart refuses to render.
  existingSecret: ""
  # Inline connection string (postgres only) — the chart puts it into a Secret for you.
  # Prefer existingSecret in anything beyond a lab.
  connectionString: ""

vault:
  # Secret with key "vaultKey" holding the VAULT_KEY passphrase. Strongly recommended: without
  # it the secret vault (and kubeconfig-based Kubernetes servers, encrypted backups) is disabled.
  existingSecret: ""
  # Inline passphrase — the chart puts it into a Secret for you. Prefer existingSecret.
  key: ""

# First-run: the setup wizard creates the admin account in the browser. For unattended installs
# set both (password comes from a Secret with key "adminPassword").
auth:
  adminEmail: ""
  adminPasswordSecret: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  # SignalR/WebSockets: ingress-nginx needs proxy-read-timeout/proxy-send-timeout raised or the
  # Blazor circuit drops every 60s — see the chart README. Traefik needs nothing.
  annotations: {}
  hosts: []
  #  - host: whiskers.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []

# Mesh VPN (R1-46): the Whiskers container never runs a VPN daemon on Kubernetes. The pod is non-root with a
# read-only root file system, where the image's legacy Tailscale bring-up cannot work, so the chart always sets
# VPN_PROVIDER=none and Vpn__Provider=none and entrypoint.sh skips it; the in-app providers (tailscale/netbird) are
# not supported here. For mesh access use the sidecar below. extraEnv may not override these names (the chart
# refuses to render).
#
# Optional Tailscale sidecar (userspace networking — no NET_ADMIN/devices needed) so Whiskers can
# reach a mesh-connected fleet. Secret must hold key "authKey" (a tailscale auth key).
tailscaleSidecar:
  enabled: false
  # Pinned: a release tag plus the multi-arch index digest (tailscale/tailscale v1.104.4). The chart refuses an image
  # without a tag or digest and the tag "latest". Update both parts together.
  image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
  authKeySecret: ""
  hostname: whiskers
  # The node's identity (tailscaled state). Persistent by default: on its own PVC, so a restarted pod is the same
  # tailnet node and the auth key is used once (TS_AUTH_ONCE). persistent=false keeps it in an emptyDir: every
  # restart registers a new node and needs a reusable (preferably ephemeral) auth key.
  state:
    persistent: true
    size: 128Mi
    storageClass: ""
    # Use an existing PVC instead of creating one.
    existingClaim: ""

# Mount the node's Docker socket into the pod. Almost never what you want on Kubernetes — it ties
# the pod to one node AND grants root-equivalent control over that node's Docker. Off by default.
localDocker:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 1Gi

# Probe budgets. Whiskers answers no HTTP request until its start is done, including the pre-upgrade backup and the
# schema migrations of a new release (R1-34), so the startup probe must outlast them: otherwise the kubelet kills the
# pod mid-migration and it starts again into the same work. Budget = periodSeconds x failureThreshold, 5 minutes by
# default; raise failureThreshold for a large database (the backup and the migrations both grow with it).
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  # Deliberately lazy so a busy Blazor app is not probed to death.
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 5

# Extra environment variables (name/value pairs), e.g. OIDC settings. The VPN mode (VPN_PROVIDER, Vpn__Provider, also
# behind DOTNET_/ASPNETCORE_, in any letter case, with ":" for "__"), TAILSCALE_AUTHKEY and VPN_FORCE_LEGACY_TAILSCALE are
# fixed by the chart and refused here.
# Put secrets in a Secret and use valueFrom, not a value.
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Forwarded headers (R1-50): without entries Whiskers trusts loopback only, so behind an ingress controller every
# visitor has the controller's pod address (login rate limit, audit) and HTTPS is seen as HTTP (cookie without Secure,
# Google/OIDC callback with http://). List the ingress controller's pod CIDR or
# addresses here (CIDR strings or single addresses) — narrowly: anything in a listed range can claim any client address.
# An entry that is neither a CIDR nor an address stops the start.
trustedProxyCidrs: []
